# P2.02 Information Architecture — PROPOSED navigation design contract
# Owner review pending; NOT a runtime navigation menu, router or authorization engine.
# All examples synthetic. All 14 risks + 12 pending decisions remain OPEN; 727 tests NOT RUN.
schema_version: "0.1-draft"
phase: "P2.02"
status: "PROPOSED_INTERNAL_UX_NOT_IMPLEMENTED"
source: "docs/design/route-inventory.csv"
source_permissions: "docs/security/permission-matrix.csv"
security:
  authoritative_guard: "SERVER_VERIFIED_ACTIVE_MEMBERSHIP_PLUS_ENTITLEMENT_PLUS_ROLE_RECORD_FIELD"
  urls_are_not_authority: true
  default_denial: "HIDE_UNAUTHORIZED_NAV_AND_DENY_DIRECT_ROUTE"
  owner_admin_universal_crm_access: false
  direct_link_policy: "RETURN_SAFE_403_OR_PRIVACY_404_WITH_NO_HIDDEN_DATA"
  tenant_switch_policy: "REVERIFY_MEMBERSHIP_CLEAR_TENANT_CACHE_CANCEL_STALE_REQUESTS"
  external_agents_login_supported: false
  restricted_production_data_supported: false
  prohibited_module_routes_linked: false
interface:
  app_shell_label: "Workspace OS — design placeholder only"
  repository_name: "Zoho Clone — internal only"
  desktop: "sidebar_plus_topbar_plus_breadcrumb"
  tablet: "collapsible_sidebar"
  mobile: "accessible_navigation_drawer_with_shortcuts"
  breadcrumb_rule: "derive_from_current_authorized_ancestors"
  active_item_rule: "match_exact_or_valid_nested_route"
  search_rule: "only_permitted_organization_resources_and_fields"
  empty_state_rule: "differentiate_no_data_filtered_no_permission_not_entitled_without_leaking_hidden_counts"
  module_launcher_rule: "verified_entitlements_plus_independent_resource_permissions"
  unsaved_change_guard: "ask_before_org_switch_or_route_change"
  fake_status_rule: "internal_status_and_demo_source_are_not_processor_verification"
  mock_billing_rule: "label_demo_no_charges"
workspace_context:
  organization_selector:
    route_id: "APP-001"
    lists_only: "verified_active_memberships"
    requires_server_verification: true
  bootstrap_workspace:
    route_id: "APP-002"
    permission: "verified_identity_new_workspace_only"
  profile:
    route_id: "APP-003"
    integration_decision: "OPEN-001_MANAGED_IDENTITY_PROVIDER"
  sign_in:
    route_id: "AUTH-001"
  invitation_acceptance:
    route_id: "AUTH-005"
    verification_pending: true
