name: P3 Scaffold Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # P3.03: check in the Node 22 npm workspace lockfile and install exactly.
      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check source
        run: npm run typecheck

      - name: Validate P4 R35 identity-only Auth0 configuration with fictional inputs
        run: node scripts/p4-r35-auth0-preflight.mjs --ci

      - name: Validate R83 staging preparation and approval checklist
        run: |
          node scripts/p4-r83-staging-plan.mjs --ci
          node --test scripts/p4-r83-staging-plan.test.mjs

      - name: Validate P4 R36 staging blueprint and official NO_GO gate invariants
        run: node scripts/p4-r36-staging-preflight.mjs --ci

      - name: Preserve P4 R37 browser-memory invitation UI security boundary
        run: node scripts/p4-r37-browser-boundary.mjs

      - name: Validate P4 R38 fictional renewal and member reactivation UI boundary
        run: node scripts/p4-r38-demo-contract.mjs

      - name: Validate P4 R39 fictional member directory, role history and revoked-manager downgrade
        run: node scripts/p4-r39-member-role-contract.mjs

      - name: Validate P4 R40 CI-only owner role API and production import isolation
        run: node scripts/p4-r40-source-contract.mjs

      - name: Preserve P4 R41 typed localhost member roles client import contract
        run: node scripts/p4-r41-client-contract.mjs

      - name: Validate P4 R42 role history owner-only and production import isolation
        run: node scripts/p4-r42-history-contract.mjs

      - name: Preserve P4 R43 owner-only revocation, replay and privilege-reset boundaries
        run: node scripts/p4-r43-revocation-contract.mjs

      - name: Verify P4 R44 signed fictional directory and live-app separation
        run: node scripts/p4-r44-member-directory-contract.mjs

      - name: Preserve P4 R45 signed owner renewal, immutable audit and outbox boundaries
        run: node scripts/p4-r45-renewal-contract.mjs

      - name: Verify P4 R46 signed cancellation and immutable audit source isolation
        run: node scripts/p4-r46-cancellation-contract.mjs

      - name: Preserve P4 R47 signed owner invitation directory and live-app isolation
        run: node scripts/p4-r47-invitation-directory-contract.mjs

      - name: Preserve P4 R48 signed cursor SQL and live separation
        run: node scripts/p4-r48-keyset-contract.mjs

      - name: Preserve P4 R49 signed member cursor isolation and production boundary
        run: node scripts/p4-r49-keyset-contract.mjs

      - name: Preserve P4 R50 signed aggregate-only owner summary boundaries
        run: node scripts/p4-r50-owner-summary-contract.mjs

      - name: Preserve P4 R51 owner activity audit redaction and live import boundary
        run: node scripts/p4-r51-owner-activity-contract.mjs

      - name: Preserve P4 R52 canonical HMAC owner audit paging source isolation
        run: node scripts/p4-r52-owner-activity-keyset-contract.mjs

      - name: Preserve P4 R53 React CI owner management UI and no live Next.js route imports
        run: node scripts/p4-r53-owner-workspace-contract.mjs

      - name: Preserve P4 R54 signed owner organization chooser and production isolation
        run: node scripts/p4-r54-owned-organizations-contract.mjs

      - name: Enforce P4 R55 React owner selector, scoped writes and live import boundary
        run: node scripts/p4-r55-owner-switcher-contract.mjs

      - name: Enforce P4 R56 secure fictional recipient React one-use token form
        run: node scripts/p4-r56-recipient-react-contract.mjs

      - name: Enforce P4 R57 persisted owner-only CRM and live import boundary
        run: node scripts/p4-r57-crm-leads-contract.mjs

      - name: Enforce P4 R58 CRM lead progression and immutable audit source boundary
        run: node scripts/p4-r58-crm-lead-stages-contract.mjs

      - name: Preserve P4 R59 real CRM React UI and no normal app activation
        run: node scripts/p4-r59-crm-react-contract.mjs

      - name: Preserve P4 R60 signed owner CRM keyset page boundary
        run: node scripts/p4-r60-crm-lead-page-contract.mjs

      - name: Preserve P4 R61 immutable signed CRM note and live import boundary
        run: node scripts/p4-r61-crm-lead-notes-contract.mjs

      - name: Preserve P4 R62 integrated CRM React page and immutable notes import isolation
        run: node scripts/p4-r62-crm-workspace-contract.mjs

      - name: Enforce P4 R63 immutable note pagination CI source boundaries
        run: node scripts/p4-r63-crm-note-page-contract.mjs

      - name: Preserve P4 R64 signed CRM follow-up due-date task boundaries
        run: node scripts/p4-r64-crm-task-contract.mjs

      - name: Verify P4 R65 integrated React follow-up tasks and paged notes source boundary
        run: node scripts/p4-r65-followup-react-contract.mjs

      - name: Run workspace tests (frontend, backend, shared demo contracts)
        run: npm run test

      - name: Build frontend and backend
        run: npm run build

      - name: Assert built Express app cannot import synthetic CI-only platform modules
        run: node scripts/p4-ci-compiled-boundary.mjs

      - name: Check for accidentally tracked secrets and generated files
        run: |
          bash scripts/check-tracked-artifacts.sh
          node --test scripts/*.test.mjs
          node scripts/check-tracked-secrets.mjs
          node scripts/p4-ci-route-isolation.mjs
          node scripts/p3-neon-first-preflight.mjs --ci

      - name: Validate P4 formal release evidence without approving production
        run: node scripts/p4-release-gate-evidence.mjs

      - name: Verify R92 owner handoff and preserved release decisions
        run: node scripts/p4-r92-owner-handoff.mjs

      - name: Reconcile R90 original acceptance inventory and historical CI references
        run: node scripts/p4-r90-acceptance-review.mjs

      - name: Validate original P1.09 inventory and P4 partial evidence links without claiming acceptance
        run: node scripts/p4-acceptance-traceability.mjs

      - name: Verify local synthetic process and fail-closed readiness
        run: bash scripts/verify-synthetic-preview.sh

      - name: Validate disposable Docker Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Scan production dependencies for critical vulnerabilities
        run: npm audit --omit=dev --audit-level=critical


  synthetic-postgres-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: zoho_clone_synthetic_ci
          POSTGRES_USER: demo_ci
          POSTGRES_PASSWORD: fake_ci_not_for_real_accounts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo_ci -d zoho_clone_synthetic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: zoho_clone_synthetic_ci
      PGUSER: demo_ci
      PGPASSWORD: fake_ci_not_for_real_accounts
    steps:
      - uses: actions/checkout@v4
      - name: Verify psql client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Apply provisional synthetic schema and fictional fixtures
        run: |
          psql -X -v ON_ERROR_STOP=1 -f backend/db/migrations/001_synthetic_foundation.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/fixtures/001_synthetic_seed.sql
      - name: Execute PostgreSQL RLS and relational-isolation assertions
        run: psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/001_synthetic_isolation.sql

      - name: Validate P4.01-P4.05 CI-only identity and organization candidate
        run: |
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/004_p4_synthetic_identity_foundation.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/004_p4_synthetic_identity_foundation.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/005_p4_synthetic_membership_invitations.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/005_p4_synthetic_memberships_invitations.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/006_p4_synthetic_access_roles_teams.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/006_p4_synthetic_access_roles_teams.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/007_p4_synthetic_settings_apps_audit_files.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/007_p4_synthetic_settings_apps_audit_files.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/008_p4_synthetic_continuity.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/008_p4_synthetic_continuity.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/009_p4_synthetic_verified_identity_lookup.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/009_p4_synthetic_verified_identity_lookup.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/010_p4_v1_uuidv4_relational_isolation.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/010_p4_v1_uuidv4_relational_isolation.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/011_p4_v1_ci_identity_app_access.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/011_p4_v1_ci_identity_app_access.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/012_p4_v1_ci_record_field_acl.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/012_p4_v1_ci_record_field_acl.sql
      - name: Run real pg client under restricted RLS against two disposable tenants
        env:
          CI: 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run build -w backend
          node backend/dist/scripts/p4-ci-live-read.js
          node backend/dist/scripts/p4-ci-v1-uuidv4-tenant-smoke.js
          node backend/dist/scripts/p4-ci-v1-prisma-smoke.js
