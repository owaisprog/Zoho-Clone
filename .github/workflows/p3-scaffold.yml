      - name: Rehearse P1.06 business roles and private-team sharing after legacy CI smoke
        run: |
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/013_p4_r7_approved_permission_rehearsal.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/013_p4_r7_approved_permission_rehearsal.sql
      - name: Verify owner-approved D1/D2/D4/D5 in real Prisma and synthetic HTTP (disposable CI)
        env:
          CI: 'true'
          GITHUB_ACTIONS: 'true'
        run: node backend/dist/scripts/p4-ci-r8-approved-authz-smoke.js
      - name: Prove atomic CI-only audit of synthetic role/team changes
        run: |
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/014_p4_r9_ci_audited_role_team_rehearsal.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/014_p4_r9_ci_audited_role_team_rehearsal.sql
