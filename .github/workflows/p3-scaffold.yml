name: P3 Scaffold Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # P3.03: check in the Node 22 npm workspace lockfile and install exactly.
      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check source
        run: npm run typecheck

      - name: Run workspace tests (frontend, backend, shared demo contracts)
        run: npm run test

      - name: Build frontend and backend
        run: npm run build
