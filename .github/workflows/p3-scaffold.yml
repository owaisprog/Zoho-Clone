name: P3 Scaffold Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # P3.03: check in the Node 22 npm workspace lockfile and install exactly.
      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check source
        run: npm run typecheck

      - name: Run workspace tests (frontend, backend, shared demo contracts)
        run: npm run test

      - name: Build frontend and backend
        run: npm run build

      - name: Check for accidentally tracked secrets and generated files
        run: |
          bash scripts/check-tracked-artifacts.sh
          node --test scripts/*.test.mjs
          node scripts/check-tracked-secrets.mjs
          node scripts/p3-neon-first-preflight.mjs --ci

      - name: Verify local synthetic process and fail-closed readiness
        run: bash scripts/verify-synthetic-preview.sh

      - name: Validate disposable Docker Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Scan production dependencies for critical vulnerabilities
        run: npm audit --omit=dev --audit-level=critical


  synthetic-postgres-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: zoho_clone_synthetic_ci
          POSTGRES_USER: demo_ci
          POSTGRES_PASSWORD: fake_ci_not_for_real_accounts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo_ci -d zoho_clone_synthetic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: zoho_clone_synthetic_ci
      PGUSER: demo_ci
      PGPASSWORD: fake_ci_not_for_real_accounts
    steps:
      - uses: actions/checkout@v4
      - name: Verify psql client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Apply provisional synthetic schema and fictional fixtures
        run: |
          psql -X -v ON_ERROR_STOP=1 -f backend/db/migrations/001_synthetic_foundation.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/fixtures/001_synthetic_seed.sql
      - name: Execute PostgreSQL RLS and relational-isolation assertions
        run: psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/001_synthetic_isolation.sql

      - name: Validate P4.01-P4.05 CI-only identity and organization candidate
        run: |
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/004_p4_synthetic_identity_foundation.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/004_p4_synthetic_identity_foundation.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/005_p4_synthetic_membership_invitations.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/005_p4_synthetic_memberships_invitations.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/006_p4_synthetic_access_roles_teams.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/006_p4_synthetic_access_roles_teams.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/007_p4_synthetic_settings_apps_audit_files.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/007_p4_synthetic_settings_apps_audit_files.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/008_p4_synthetic_continuity.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/008_p4_synthetic_continuity.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/009_p4_synthetic_verified_identity_lookup.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/009_p4_synthetic_verified_identity_lookup.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/010_p4_v1_uuidv4_relational_isolation.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/010_p4_v1_uuidv4_relational_isolation.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/011_p4_v1_ci_identity_app_access.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/011_p4_v1_ci_identity_app_access.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/candidates/012_p4_v1_ci_record_field_acl.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/012_p4_v1_ci_record_field_acl.sql
      - name: Run real pg client under restricted RLS against two disposable tenants
        env:
          CI: 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run build -w backend
          node backend/dist/scripts/p4-ci-live-read.js
          node backend/dist/scripts/p4-ci-v1-uuidv4-tenant-smoke.js
          node backend/dist/scripts/p4-ci-v1-prisma-smoke.js
          node backend/dist/scripts/p4-ci-v1-authenticated-authorization-smoke.js

  synthetic-compose-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Boot disposable Postgres and Redis and verify fictional seed
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose -f docker-compose.yml down -v --remove-orphans' EXIT
          docker compose -f docker-compose.yml up -d --wait
          docker compose -f docker-compose.yml exec -T postgres \
            psql -U demo_local -d zoho_clone_synthetic -Atc \
            'SELECT count(*) FROM synthetic.organizations' | grep -x '2'
          docker compose -f docker-compose.yml exec -T redis redis-cli PING | grep -x 'PONG'
          # Real Prisma 7 runtime, read-only restricted role and RLS in an
          # isolated fake database. NEVER an Auth0 user or production API.
          npm ci --no-audit --no-fund
          npm run build -w backend
          DATABASE_URL='postgresql://p3_preview_runtime:fake_p3_preview_only@127.0.0.1:5433/zoho_clone_synthetic' \
            node backend/dist/scripts/p3-prisma-local-smoke.js

  prisma-schema-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # P3.05/06: schema remains synthetic-only; Prisma runtime is used
      # only in the disposable Compose smoke job, never production.
      - name: Validate provisional Prisma 7 schema without connecting to a database
        run: npx --yes prisma@7.9.1 validate --schema backend/db/schema.prisma
      - name: Validate isolated UUIDv4 Prisma CI model (no database connection)
        run: npx --yes prisma@7.9.1 validate --schema backend/db/p4-v1-ci.prisma
