name: TEMPORARY P3 Auth0 dependency lock synchronization
on:
  push:
    branches:
      - chore/p3-master-roadmap-hardening-20261116

permissions:
  contents: write

jobs:
  update-auth0-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile after Auth0 package changes
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to the same development branch (never main)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already synchronized'
            exit 0
          fi
          git commit -m 'chore(P3.13): synchronize Auth0 npm dependency lockfile'
          git push origin HEAD:chore/p3-master-roadmap-hardening-20261116
