name: Temporary P3 lockfile capture
on:
  push:
    branches: [feat/p3-batch-01]
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compute npm lockfile (temporary; remove workflow after capture)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo 'P3_LOCK_BEGIN'
          base64 --wrap=1200 package-lock.json
          echo
          echo 'P3_LOCK_END'
