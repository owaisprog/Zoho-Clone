# TEMPORARY one-run lockfile export for the P3.05/06 dependency change.
# Read-only job: generated lockfile is emitted into action logs, then this
# workflow will be deleted. No privileged GitHub token or repository write.
name: P3 Temporary Synthetic Prisma Lock Export
on:
  pull_request:
permissions:
  contents: read
jobs:
  export-locked-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned synthetic runtime dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Export lockfile for review and immediate commit through GitHub connector
        run: |
          echo "P3_LOCKFILE_B64_BEGIN"
          base64 -w0 package-lock.json | fold -w120
          echo "P3_LOCKFILE_B64_END"
