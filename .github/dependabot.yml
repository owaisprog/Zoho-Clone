version: 2
updates:
  # P3.09: dependency patch PRs are reviewed, tested and explicitly merged.
  # Never auto-merge: Auth0, Prisma, Next and Express are security boundaries.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Karachi
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Karachi
    open-pull-requests-limit: 5
    labels:
      - dependencies
