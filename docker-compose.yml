# P3.08: disposable, LOCAL and SYNTHETIC data only. Never connect real clients.
name: zoho-clone-synthetic
services:
  postgres:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_DB: zoho_clone_synthetic
      POSTGRES_USER: demo_local
      POSTGRES_PASSWORD: fake_demo_local_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - synthetic_pg:/var/lib/postgresql/data
      - ./backend/db/migrations/001_synthetic_foundation.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/fixtures/001_synthetic_seed.sql:/docker-entrypoint-initdb.d/02-fixtures.sql:ro
      - ./backend/db/migrations/002_local_synthetic_runtime_role.sql:/docker-entrypoint-initdb.d/03-local-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_local -d zoho_clone_synthetic"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    restart: "no"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  synthetic_pg:
