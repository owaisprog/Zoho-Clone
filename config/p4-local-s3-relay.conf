# Fixed localhost S3 relay. No dynamic upstream, administrative paths or access logs.
server {
    listen 8080;
    server_name _;
    access_log off;
    client_max_body_size 4096;
    location ~ "^/zoho-local-(quarantine|clean)(/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})?$" {
        if ($args != "") { return 403; }
        limit_except GET HEAD PUT DELETE { deny all; }
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_pass http://seaweedfs:8333;
    }
    location / { return 403; }
}
